name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
      - name: Install locpipe from checkout
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Run public tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run installed-style demo
        run: python -m locpipe.demo
      - name: Write canonical matrix
        run: python tools/write_canonical_matrix.py canonical/${{ matrix.os }}-py${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-${{ matrix.os }}-py${{ matrix.python }}
          path: canonical/*.json
          if-no-files-found: error

  canonical-parity:
    name: canonical parity
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: canonical-*
          path: canonical
          merge-multiple: true
      - run: python tools/compare_canonical_matrix.py canonical

  package:
    name: package and security
    needs: canonical-parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
      - run: python tools/check_public_boundary.py
      - run: python -m pip_audit --require-hashes -r requirements-runtime.lock
      - run: python tools/check_reproducible.py
      - run: python -m build --no-isolation --outdir dist
        env:
          SOURCE_DATE_EPOCH: "1704067200"
      - run: python -m pip download --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-runtime.lock --dest dist
      - name: Select unique built wheel
        id: built_wheel
        shell: python
        run: |
          import os
          from pathlib import Path

          wheels = sorted(Path("dist").glob("locpipe-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one built locpipe wheel, found {len(wheels)}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"path={wheels[0].as_posix()}\n")
      - run: python tools/check_installed_wheel.py "${{ steps.built_wheel.outputs.path }}"
      - run: cyclonedx-py requirements requirements-runtime.lock --output-format JSON --output-file dist/sbom.cdx.json
      - run: python tools/write_release_metadata.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: locpipe-release-candidate
          path: dist/*
          if-no-files-found: error
